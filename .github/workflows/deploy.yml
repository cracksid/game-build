# Build the app and publish it to GitHub Pages.
#
# The tests run before the build, so a change that breaks a rule of Ludo can
# never reach the live site -- the deploy simply does not happen.
#
# No `base` is set anywhere for this: vite.config.ts already builds with
# `base: "./"`, so every asset path in the built index.html is relative. That
# works unchanged whether the site is served from the root of a domain or from
# a /repo-name/ subpath, which is what Pages gives you.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued deploy waits
# rather than being thrown away -- the last push should always win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the rules
        run: npm test

      - name: Build
        run: npm run build

      # `enablement: true` lets this step turn Pages ON by itself, using the
      # `pages: write` permission above. Without it the step fails on a repo
      # where Pages has never been set up -- and the Settings page offers no
      # "GitHub Actions" source to pick until a site exists, which is a neat
      # little deadlock. This breaks it without anyone visiting Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
