    <meta

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

    <!--
      Baloo 2 is a rounded, friendly face that also covers Devanagari, so the
      Hindi locale keeps the same personality. Every rule falls back to a
      system stack, so the app looks right before the font arrives and stays
      right if it never does (offline, or a blocked CDN).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>

    <script type="module" src="/src/main.tsx"></script>
